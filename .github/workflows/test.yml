name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run scripts/extract_cldr_regions.py --check
      - run: uv run scripts/validate_board.py
      - run: uv run pytest -q
