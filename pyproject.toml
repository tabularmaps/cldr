[project]
name = "cldr-tabular-map"
version = "0.1.0"
description = "A geographically optimized tabular map of regular Unicode CLDR region identifiers."
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
