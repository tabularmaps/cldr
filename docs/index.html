<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLDR Tabular Map — Open MCT</title>
    <!-- Open MCT 4.3.1 from unpkg. When changing the version, confirm with `curl -sI` that both
         dist/openmct.js and dist/espressoTheme.css exist: a missing version renders a blank page. -->
    <link rel="stylesheet" href="https://unpkg.com/openmct@4.3.1/dist/espressoTheme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="tm-dark">
    <script>
      // Loaded from a CDN, Open MCT's search indexer tries to start a SharedWorker cross-origin and is
      // blocked; disabling SharedWorker makes Open MCT fall back to its synchronous indexer.
      window.SharedWorker = undefined;
    </script>
    <script src="https://unpkg.com/openmct@4.3.1/dist/openmct.js"></script>
    <div id="app"></div>
    <script src="./tabularmap.js"></script>
    <script src="./openmct-plugin.js"></script>
    <script src="./demo-sources.js"></script>
    <script>
      (function () {
        const script = document.querySelector('script[src*="openmct.js"]');
        if (script) openmct.setAssetPath(script.src.replace(/openmct\.js(?:\?.*)?$/, ''));
        openmct.install(openmct.plugins.LocalStorage());
        openmct.install(openmct.plugins.UTCTimeSystem());
        openmct.install(openmct.plugins.Espresso());
        openmct.install(TabularMapsCldrPlugin({ dataUrl: './data/', sources: window.TABULARMAPS_CLDR_DEMO_SOURCES }));
        openmct.start('#app');
      })();
    </script>
  </body>
</html>
